name: Unzip patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo
        run: |
          Z=$(ls *.zip | head -n 1)
          echo "Using $Z"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$Z" -d /tmp/x
          D=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then D="/tmp/x/$(ls /tmp/x)"; fi
          cp -a "$D/." .
          rm -f "$Z"
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply patch" || echo "nothing to commit"
          git push
